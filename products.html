<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shop | Timeless Threads</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="container nav">

            <a class="brand" href="index.html">
                <img
                    class="brand-mark"
                    src="assets/images/logo-dark.png"
                    alt="Timeless Threads logo"
                >
                <span>Timeless Threads</span>
            </a>

            <button
                class="nav-toggle"
                type="button"
                aria-label="Open navigation menu"
            >
                ☰
            </button>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="features.html">Features</a>
                <a href="products.html">Shop</a>
                <a href="campaign.html">Campaign</a>
                <a href="contact.html">Contact</a>

                <a
                    class="btn btn-primary"
                    href="products.html"
                >
                    Shop Now
                </a>
            </nav>

        </div>
    </header>


    <!-- MAIN CONTENT -->
    <main>

        <!-- PAGE HERO -->
        <section class="page-hero">
            <div class="container">

                <span class="eyebrow">
                    Shop the Drop
                </span>

                <h1>Our Collection.</h1>

                <p>
                    Browse all five Timeless Threads designs.
                </p>

            </div>
        </section>


        <!-- PRODUCTS SECTION -->
        <section class="section">
            <div class="container">

                <!-- TOOLBAR -->
                <div class="toolbar">

                    <!-- SEARCH -->
                    <div class="search-wrap">

                        <input
                            id="productSearch"
                            type="search"
                            placeholder="Search products, categories, or styles…"
                            aria-label="Search products"
                        >

                    </div>


                    <!-- CATEGORY FILTERS -->
                    <div class="filters">

                        <button
                            class="filter-btn active"
                            type="button"
                            data-category="All"
                        >
                            All
                        </button>

                        <button
                            class="filter-btn"
                            type="button"
                            data-category="Essentials"
                        >
                            Essentials
                        </button>

                        <button
                            class="filter-btn"
                            type="button"
                            data-category="Nature Collection"
                        >
                            Nature
                        </button>

                        <button
                            class="filter-btn"
                            type="button"
                            data-category="Graphic Collection"
                        >
                            Graphic
                        </button>

                        <button
                            class="filter-btn"
                            type="button"
                            data-category="Minimal Collection"
                        >
                            Minimal
                        </button>

                    </div>

                </div>


                <!-- PRODUCT GRID -->
                <div
                    id="productGrid"
                    class="grid-3"
                >
                </div>

            </div>
        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container">

            <div class="footer-title">
                Timeless Threads
            </div>

            <p>
                Classic Style. Made for Today.
                • Mabalacat City, Pampanga
            </p>

            <a href="data-demo.html">
                View API/Data Demo →
            </a>

        </div>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="js/main.js"></script>
    <script src="js/data.js"></script>
    <script src="js/products.js"></script>

</body>

</html>
